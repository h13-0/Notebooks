version: 1

review_dir: "AI-Review"

language:
  primary: "zh-Hans"
  require_simplified_chinese: true
  allow_foreign_terms: true

default_mode:
  scope: "changed"
  dry_run: true

unit:
  split_by_headings: true
  heading_levels: [1, 2, 3, 4, 5, 6]
  skip_empty_heading: true

normalize:
  ignore_ai_review_blocks: true
  trim_blank_lines: true
  collapse_blank_lines: true
  strip_trailing_spaces: true

scan:
  exclude_paths:
    - "AI-Review"
    - "skills"
    - ".codex"
    - ".cursor"
    - "tools/ai-review"
    - "Readme.md"
    - "AGENTS.ai-review.md"
    - "AI-Review-SLASH_COMMANDS.md"
    - "README.ai-review-skill.md"
    - "Linux内核原理及其开发/minimal-linux-drivers"

severity:
  callout:
    Enhance: tip
    Minor: attention
    Major: bug
    Critical: danger
    Unknown: question

voting:
  main_model_vote_enabled: true
  main_model_vote_visible: true
  host_current_allowed: true
  issue_score_threshold: 3.0
  max_missing_vote_ratio: 0.5
  severity_thresholds:
    Enhance:
      min_normalized_score: 0.70
    Minor:
      min_normalized_score: 0.70
    Major:
      min_normalized_score: 0.70
    Critical:
      min_normalized_score: 0.70

models:
  main:
    mode: "host-current"   # host-current / configured / none
    id: "host-current"
    display_name: "当前 Codex/Cursor 主模型"
    role: "main"
    vote_enabled: true
    weight: 5

  configured_main:
    id: "gpt-main"
    display_name: "Configured Main Model"
    provider: "openai-compatible"
    model: "gpt-x"
    multimodal: true
    role: "main"
    vote_enabled: true
    weight: 5

  voters:
    - id: "deepseek-v4-pro"
      display_name: "DeepSeek-V4-Pro"
      provider: "deepseek"
      model: "deepseek-v4-pro"
      multimodal: false
      weight: 2
      role: "voter"
      vote_enabled: true
      concurrency: 2
      thinking:
        enabled: true
        effort: "high"
      generation:
        max_tokens: 8192
        temperature: 0.1
    - id: "qwen3.6-max-preview"
      display_name: "Qwen3.6-Max-Preview"
      provider: "aliyun"
      model: "qwen3.6-max-preview"
      multimodal: false
      weight: 2
      role: "voter"
      vote_enabled: true
      concurrency: 1
      thinking:
        enabled: true
        effort: "high"
      generation:
        max_tokens: 8192
        temperature: 0.1
    - id: "qwen3.6-plus"
      display_name: "Qwen3.6-Plus"
      provider: "aliyun"
      model: "qwen3.6-plus"
      multimodal: true
      weight: 2
      role: "voter"
      vote_enabled: true
      concurrency: 1
      thinking:
        enabled: true
        effort: "high"
      generation:
        max_tokens: 8192
        temperature: 0.1
    - id: "kimi-k2.6"
      display_name: "Kimi-K2.6"
      provider: "moonshot"
      model: "kimi-k2.6"
      multimodal: true
      weight: 2
      role: "voter"
      vote_enabled: true
      concurrency: 1
      thinking:
        enabled: true
        effort: "high"
      generation:
        max_tokens: 8192
        temperature: 1


context:
  include_outlinks: true
  include_backlinks: true
  include_outlink_blocks: true
  max_outlinks: 8
  max_outlink_chars: 2500
  max_backlinks: 5
  max_context_tokens: 8192

attachments:
  svg:
    convert_to_png: true
    cache: "temp"
  archive:
    enabled: true
    formats: [".zip"]
    max_size_mb: 5
    max_files: 50

git:
  require_clean_worktree: true
  require_synced_with_upstream: true
  fetch_before_check: true

submodules:
  scan: true
  write_annotations: true
  require_clean_worktree: true
  require_synced_with_upstream: true
  skip_uninitialized: true
  skip_if_head_mismatch: true

dashboard:
  top_n_per_section: 10
  topic_keywords_per_unit: 5

runtime:
  max_concurrency: 3
  request_timeout_sec: 300
  stream: true
  stream_total_timeout_sec: 1800
  retry: 1
  warn_once_per_model: true
  model_failure_policy: "skip_model"
  no_eligible_model_policy: "skip"

write:
  preserve_user_notes: true
  compact_callout: true
  auto_commit: false
  backup: false
