# YAML 配置示例，请根据实际环境调整路径与参数。
variables:
  vault_dir: D:/Obsidian/Notebooks
  export_path: D:/Obsidian/export
  docker_image: obsidian-webpage-export:latest
  vault_git_branch: master
  remote_sync_path: /tmp/notebooks-sync
  deploy_path: /opt/my-app
  statistics_image: statistics/output.png
  post_deploy_commands:
    - find /opt/my-app -type d -exec chmod 0755 {} \;
    - find /opt/my-app -type f -exec chmod 0644 {} \;

scripts:
  exporter:
    docker:
      image: "{docker_image}"
      vault_dir: "{vault_dir}"
      output_dir: "{export_path}"
      git_branch: "{vault_git_branch}"
      env:
        EXPORT_ENTIRE_VAULT: "1"
  statistics:
    path: statistics/statistics.py
    args:
      - --repo-path
      - "{vault_dir}"
      - --cache
      - statistics/statistics.json
      - --output
      - "{statistics_image}"
      - --filter-config
      - statistics/statistics_config.json

remote:
  port: 22

sync:
  source: "{export_path}"
  remote_path: "{remote_sync_path}"
  options:
    - -az
    - --delete
    - --compress
  ssh_options: []
  retries: 3

deploy:
  source: "{remote_sync_path}"
  deploy_path: "{deploy_path}"
  options:
    - -a
    - --delete
