# YAML 配置示例，请根据实际环境调整路径与参数。
variables:
  vault_dir: D:/Obsidian/Notebooks
  export_path: D:/Obsidian/export
  obsidian_path: C:/Users/Username/AppData/Local/Programs/Obsidian/Obsidian.exe
  repo_branch: master
  obsidian_process_name: Obsidian.exe
  remote_sync_path: /tmp/notebooks-sync
  deploy_path: /opt/my-app
  statistics_image: statistics/output.png
  post_deploy_commands:
    - find /opt/my-app -type d -exec chmod 0755 {} \;
    - find /opt/my-app -type f -exec chmod 0644 {} \;

scripts:
  exporter:
    path: exporter/exporter.py
    args:
      - --vault-dir
      - "{vault_dir}"
      - --export-path
      - "{export_path}"
      - --obsidian-path
      - "{obsidian_path}"
      - --git-branch
      - "{repo_branch}"
      - --window-title
      - ".*Obsidian.*"
    terminate_process: "{obsidian_process_name}"
  statistics:
    path: statistics/statistics.py
    args:
      - --repo-path
      - "{vault_dir}"
      - --cache
      - statistics/statistics.json
      - --output
      - "{statistics_image}"

remote:
  port: 22

sync:
  source: "{export_path}"
  remote_path: "{remote_sync_path}"
  options:
    - -az
    - --delete
    - --compress
  ssh_options: []
  retries: 3

deploy:
  source: "{remote_sync_path}"
  deploy_path: "{deploy_path}"
  options:
    - -a
    - --delete
